<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="6; url=https://mkcapili.art/pipeline/">
<link rel="canonical" href="https://mkcapili.art/pipeline/">
<title>Baroque Pipeline</title>
<style>
:root{--bg:#EEF0F4;--card:#FFFFFF;--ink:#15181F;--muted:#5B6270;--faint:#8A909C;--navy:#1A2B4A;--hair:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1016;--card:#191C24;--ink:#F2F3F6;--muted:#A6ACB8;--faint:#7C8290;--navy:#2E4A7D;--hair:rgba(255,255,255,.1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{width:min(400px,100%);padding:30px 24px 22px;border-radius:24px;text-align:center;background:var(--card);border:1px solid var(--hair);box-shadow:0 24px 60px rgba(0,0,0,.14)}
.ic{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:700;font-size:18px;letter-spacing:.02em}
h1{font-size:21px;margin:0 0 8px}
p{margin:0 0 18px;color:var(--muted);font-size:15px}
a.go{display:flex;align-items:center;justify-content:center;height:48px;border-radius:14px;background:var(--navy);color:#fff;font-weight:650;text-decoration:none}
a.go:focus-visible{outline:3px solid #6EA8FE;outline-offset:2px}
small{display:block;margin-top:12px;color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<main class="card" role="dialog" aria-labelledby="t">
  <div class="ic" aria-hidden="true">BG</div>
  <h1 id="t">The Project Register has moved</h1>
  <p>Please click the updated link below and sign in with your username and password. This old page is no longer used.</p>
  <a class="go" href="https://mkcapili.art/pipeline/">Open mkcapili.art/pipeline</a>
  <small>Opening automatically in a few seconds…</small>
</main>
</body>
</html>
